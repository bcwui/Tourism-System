server:
  port: 8083

spring:
  application:
    name: tourism-order
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/tourism_system?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      database: 0
      timeout: 10000
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
  cloud:
    nacos:
      config:
        enabled: false
        import-check:
          enabled: false
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:/mapper/*.xml


mq:
  consumer:
    order: true
    seckill: true

rate:
  limit:
    enabled: true
    default-max-requests: 20
    default-window: 60

user:
  fromEmail: 3536615715@qq.com
  defaultPassword: 123456

frontend:
  url: http://localhost:8087

alipay:
  appId: 9021000162618406
  privateKey: 
  publicKey: 
  gateway: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  returnUrl: http://localhost:8080/api/alipay/return
  notifyUrl: http://k2a368e2.natappfree.cc/api/alipay/notify
  charset: UTF-8
  format: json
  signType: RSA2

# API Documentation
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  packages-to-scan: org.example.springboot

knife4j:
  enable: true
  setting:
    language: zh_cn
